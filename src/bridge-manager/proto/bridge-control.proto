// Minimal client-side description of the gRPC control interface exposed by the
// official Proton Mail Bridge when started with `--grpc`.
//
// Written for this project from the observable interface of Proton Mail Bridge
// v3.27.2 (service name, method names, field numbers and types). It covers only
// what the Bridge Manager uses; it is not a copy of Proton's bridge.proto.
//
// IMPORTANT: this interface is internal to Proton Mail Bridge (it exists for
// Proton's own bridge-gui). It is not a public or stable API and may change in
// any release. See src/bridge-manager/compat.ts for the tested versions.

syntax = "proto3";

package grpc;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

service Bridge {
  rpc GuiReady (google.protobuf.Empty) returns (GuiReadyResponse);
  rpc Version (google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc GoOs (google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc LogsPath (google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc Hostname (google.protobuf.Empty) returns (google.protobuf.StringValue);
  rpc IsPortFree (google.protobuf.Int32Value) returns (google.protobuf.BoolValue);

  rpc Login (LoginRequest) returns (google.protobuf.Empty);
  rpc Login2FA (LoginRequest) returns (google.protobuf.Empty);
  rpc Login2Passwords (LoginRequest) returns (google.protobuf.Empty);
  rpc LoginAbort (LoginAbortRequest) returns (google.protobuf.Empty);

  rpc MailServerSettings (google.protobuf.Empty) returns (ImapSmtpSettings);
  rpc SetMailServerSettings (ImapSmtpSettings) returns (google.protobuf.Empty);
  rpc AvailableKeychains (google.protobuf.Empty) returns (AvailableKeychainsResponse);
  rpc CurrentKeychain (google.protobuf.Empty) returns (google.protobuf.StringValue);

  rpc GetUserList (google.protobuf.Empty) returns (UserListResponse);
  rpc GetUser (google.protobuf.StringValue) returns (User);
  rpc LogoutUser (google.protobuf.StringValue) returns (google.protobuf.Empty);
  rpc RemoveUser (google.protobuf.StringValue) returns (google.protobuf.Empty);

  rpc RunEventStream (EventStreamRequest) returns (stream StreamEvent);
  rpc StopEventStream (google.protobuf.Empty) returns (google.protobuf.Empty);
}

message GuiReadyResponse { bool showSplashScreen = 1; }

// password: the secret, base64-encoded, sent as bytes (password, TOTP code or mailbox password).
message LoginRequest {
  string username = 1;
  bytes password = 2;
  optional bool useHvDetails = 3;
}

message LoginAbortRequest { string username = 1; }

message ImapSmtpSettings {
  int32 imapPort = 1;
  int32 smtpPort = 2;
  bool useSSLForImap = 3;
  bool useSSLForSmtp = 4;
}

message AvailableKeychainsResponse { repeated string keychains = 1; }

enum UserState {
  SIGNED_OUT = 0;
  LOCKED = 1;
  CONNECTED = 2;
}

// password: the IMAP/SMTP password generated by Bridge for this account.
message User {
  string id = 1;
  string username = 2;
  string avatarText = 3;
  UserState state = 4;
  bool splitMode = 5;
  int64 usedBytes = 6;
  int64 totalBytes = 7;
  bytes password = 8;
  repeated string addresses = 9;
}

message UserListResponse { repeated User users = 1; }

message EventStreamRequest { string ClientPlatform = 1; }

// Only the event families the Manager reacts to are described; unknown
// fields of a oneof are skipped by the decoder.
message StreamEvent {
  oneof event {
    AppEvent app = 1;
    LoginEvent login = 2;
    MailServerSettingsEvent mailServerSettings = 5;
    KeychainEvent keychain = 6;
    UserEvent user = 8;
    GenericErrorEvent genericError = 9;
  }
}

message AppEvent {
  oneof event {
    InternetStatusEvent internetStatus = 1;
    AllUsersLoadedEvent allUsersLoaded = 14;
  }
}
message InternetStatusEvent { bool connected = 1; }
message AllUsersLoadedEvent {}

message LoginEvent {
  oneof event {
    LoginErrorEvent error = 1;
    UsernameEvent tfaRequested = 2;
    UsernameEvent twoPasswordRequested = 3;
    LoginFinishedEvent finished = 4;
    LoginFinishedEvent alreadyLoggedIn = 5;
    LoginHvRequestedEvent hvRequested = 6;
    UsernameEvent fidoRequested = 7;
    UsernameEvent tfaOrFidoRequested = 8;
    UsernameEvent loginFidoTouchRequested = 9;
    UsernameEvent loginFidoTouchCompleted = 10;
    UsernameEvent loginFidoPinRequired = 11;
  }
}

enum LoginErrorType {
  USERNAME_PASSWORD_ERROR = 0;
  FREE_USER = 1;
  CONNECTION_ERROR = 2;
  TFA_ERROR = 3;
  TFA_ABORT = 4;
  TWO_PASSWORDS_ERROR = 5;
  TWO_PASSWORDS_ABORT = 6;
  HV_ERROR = 7;
  FIDO_PIN_INVALID = 8;
  FIDO_PIN_BLOCKED = 9;
  FIDO_ERROR = 10;
}

message LoginErrorEvent {
  LoginErrorType type = 1;
  string message = 2;
}
message UsernameEvent { string username = 1; }
message LoginFinishedEvent {
  string userID = 1;
  bool wasSignedOut = 2;
}
message LoginHvRequestedEvent { string hvUrl = 1; }

message MailServerSettingsEvent {
  oneof event {
    MailServerSettingsErrorEvent error = 1;
    MailServerSettingsChangedEvent mailServerSettingsChanged = 2;
    EmptyEvent changeMailServerSettingsFinished = 3;
  }
}

enum MailServerSettingsErrorType {
  IMAP_PORT_STARTUP_ERROR = 0;
  SMTP_PORT_STARTUP_ERROR = 1;
  IMAP_PORT_CHANGE_ERROR = 2;
  SMTP_PORT_CHANGE_ERROR = 3;
  IMAP_CONNECTION_MODE_CHANGE_ERROR = 4;
  SMTP_CONNECTION_MODE_CHANGE_ERROR = 5;
}

message MailServerSettingsErrorEvent { MailServerSettingsErrorType type = 1; }
message MailServerSettingsChangedEvent { ImapSmtpSettings settings = 1; }

message KeychainEvent {
  oneof event {
    EmptyEvent changeKeychainFinished = 1;
    EmptyEvent hasNoKeychain = 2;
    EmptyEvent rebuildKeychain = 3;
  }
}
message EmptyEvent {}

message UserEvent {
  oneof event {
    UserIdEvent toggleSplitModeFinished = 1;
    UsernameEvent userDisconnected = 2;
    UserIdEvent userChanged = 3;
    UserBadEvent userBadEvent = 4;
    UsedBytesChangedEvent usedBytesChangedEvent = 5;
    UsernameEvent imapLoginFailedEvent = 6;
    UserIdEvent syncStartedEvent = 7;
    UserIdEvent syncFinishedEvent = 8;
    SyncProgressEvent syncProgressEvent = 9;
  }
}
message UserIdEvent { string userID = 1; }
message UserBadEvent {
  string userID = 1;
  string errorMessage = 2;
}
message UsedBytesChangedEvent {
  string userID = 1;
  int64 usedBytes = 2;
}
message SyncProgressEvent {
  string userID = 1;
  double progress = 2;
  int64 elapsedMs = 3;
  int64 remainingMs = 4;
}

message GenericErrorEvent { int32 code = 1; }
